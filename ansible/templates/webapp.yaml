apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-code
  namespace: production-app
data:
  app.py: |
    import os
    import pg8000.native
    from flask import Flask, request, redirect, render_template_string

    app = Flask(__name__)

    DB_HOST = os.environ.get("POSTGRES_HOST", "postgres-service")
    DB_NAME = os.environ.get("POSTGRES_DB", "devops_db")
    DB_USER = os.environ.get("POSTGRES_USER", "dbadmin")
    DB_PASS = os.environ.get("POSTGRES_PASSWORD", "SuperSecureTalosPassword2026!")
    NODE_NAME = os.environ.get("NODE_NAME", "Unknown-Node")
    POD_NAME = os.environ.get("POD_NAME", "Unknown-Pod")

    def get_conn():
        return pg8000.native.Connection(
            user=DB_USER,
            password=DB_PASS,
            host=DB_HOST,
            database=DB_NAME,
            port=5432
        )

    def init_db():
        try:
            con = get_conn()
            con.run("""
                CREATE TABLE IF NOT EXISTS messages (
                    id SERIAL PRIMARY KEY,
                    title VARCHAR(255) NOT NULL,
                    author VARCHAR(100) NOT NULL,
                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                );
            """)
            con.close()
            print("Database initialized successfully!")
        except Exception as e:
            print("DB init error:", e)

    HTML_TEMPLATE = """
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Talos HA + Longhorn Dashboard</title>
        <style>
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f8fafc;
                --accent: #38bdf8;
                --success: #22c55e;
                --border: #334155;
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .container {
                max-width: 900px;
                width: 100%;
            }
            header {
                text-align: center;
                margin-bottom: 30px;
            }
            h1 {
                color: var(--accent);
                margin-bottom: 10px;
                font-size: 2.2rem;
            }
            .badges {
                display: flex;
                gap: 15px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 15px;
            }
            .badge {
                background: #0369a1;
                color: white;
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 600;
            }
            .badge-success { background: #15803d; }
            .badge-purple { background: #6b21a8; }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            .card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            }
            .card h3 {
                margin-top: 0;
                color: var(--accent);
                font-size: 1.1rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
            }
            .card p { margin: 8px 0; font-size: 0.95rem; }
            .form-card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 25px;
                margin-bottom: 30px;
            }
            input, button {
                padding: 12px;
                border-radius: 8px;
                border: 1px solid var(--border);
                font-size: 1rem;
            }
            input {
                background: #0f172a;
                color: white;
                width: calc(100% - 26px);
                margin-bottom: 15px;
            }
            button {
                background: #0284c7;
                color: white;
                border: none;
                cursor: pointer;
                font-weight: bold;
                width: 100%;
                transition: background 0.2s;
            }
            button:hover { background: #0369a1; }
            table {
                width: 100%;
                border-collapse: collapse;
                background: var(--card-bg);
                border-radius: 12px;
                overflow: hidden;
            }
            th, td {
                padding: 14px 18px;
                text-align: left;
                border-bottom: 1px solid var(--border);
            }
            th { background: #111827; color: var(--accent); }
            tr:hover { background: #26334d; }
            .footer-info {
                text-align: center;
                margin-top: 30px;
                font-size: 0.85rem;
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>🚀 Talos Linux HA + Longhorn Storage</h1>
                <p>Enterprise Production Application Deployed via Jenkins CI/CD & Ansible</p>
                <div class="badges">
                    <span class="badge badge-success">● PostgreSQL Connected</span>
                    <span class="badge badge-purple">● Longhorn 3-Way Replicated PVC</span>
                    <span class="badge">● Talos Kubernetes HA</span>
                </div>
            </header>

            <div class="grid">
                <div class="card">
                    <h3>📍 Kubernetes Node</h3>
                    <p><strong>Host Node:</strong> {{ node_name }}</p>
                    <p><strong>Active Pod:</strong> {{ pod_name }}</p>
                </div>
                <div class="card">
                    <h3>💾 Distributed Storage</h3>
                    <p><strong>StorageClass:</strong> longhorn</p>
                    <p><strong>Volume:</strong> 5Gi (3 Replicas HA)</p>
                </div>
                <div class="card">
                    <h3>🐘 Database Status</h3>
                    <p><strong>Database:</strong> {{ db_name }}</p>
                    <p><strong>Status:</strong> 🟢 Online & Healthy</p>
                </div>
            </div>

            <div class="form-card">
                <h3>📝 Write Data to Longhorn Replicated Storage</h3>
                <p style="font-size: 0.9rem; color: #94a3b8;">Data saved here is replicated across all 3 physical servers. It survives complete node failures!</p>
                <form action="/add" method="POST">
                    <input type="text" name="title" placeholder="Enter message or note (e.g. Disaster Test #1)" required>
                    <input type="text" name="author" placeholder="Author name (e.g. Mikha)" required>
                    <button type="submit">💾 Save to Persistent PostgreSQL</button>
                </form>
            </div>

            <h3>📊 Records Stored in PostgreSQL:</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Message</th>
                        <th>Author</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    <tr>
                        <td>#{{ row[0] }}</td>
                        <td><strong>{{ row[1] }}</strong></td>
                        <td>{{ row[2] }}</td>
                        <td>{{ row[3] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" style="text-align: center; color: #94a3b8;">No records found yet. Write your first record above!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div class="footer-info">
                🔥 <strong>Disaster Test Tip:</strong> Insert a note above, then shut down one Proxmox node. Refresh this page to prove Zero Data Loss!
            </div>
        </div>
    </body>
    </html>
    """

    @app.route("/")
    def index():
        rows = []
        try:
            con = get_conn()
            rows = con.run("SELECT id, title, author, created_at FROM messages ORDER BY id DESC;")
            con.close()
        except Exception as e:
            print("Query error:", e)
        return render_template_string(HTML_TEMPLATE, rows=rows, node_name=NODE_NAME, pod_name=POD_NAME, db_name=DB_NAME)

    @app.route("/add", methods=["POST"])
    def add():
        title = request.form.get("title")
        author = request.form.get("author")
        if title and author:
            try:
                con = get_conn()
                con.run("INSERT INTO messages (title, author) VALUES (:title, :author);", title=title, author=author)
                con.close()
            except Exception as e:
                print("Insert error:", e)
        return redirect("/")

    @app.route("/healthz")
    def healthz():
        return "OK", 200

    if __name__ == "__main__":
        init_db()
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: production-app
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.11-alpine
        command:
        - "sh"
        - "-c"
        - "pip install --no-cache-dir flask pg8000 && python /app/app.py"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 2
        env:
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_DB
          value: "devops_db"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: code
        configMap:
          name: webapp-code
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: production-app
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30088
  selector:
    app: webapp
